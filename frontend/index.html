<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Record shared trip expenses and see who owes whom." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%237c3aed'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='white' stroke-width='2.5'/%3E%3Cpath d='M16 8a8 8 0 0 1 0 16Z' fill='white'/%3E%3C/svg%3E"
    />
    <!-- Inter for the UI; the CSS falls back to the system font if it can't load. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />
    <title>Trip Splitter</title>
    <!-- Apply the theme before the page paints, so it never flashes light then dark.
         Same rule as initialTheme() in src/theme.ts: the saved choice, else the device setting. -->
    <script>
      try {
        var saved = localStorage.getItem('trip-splitter:theme')
        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme =
          saved === 'light' || saved === 'dark' ? saved : dark ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
